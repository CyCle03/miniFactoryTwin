name: minifactorytwin

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  modbus-simulator:
    build:
      context: .
      dockerfile: modbus_simulator/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MODBUS_PORT: 5020
    depends_on:
      - mosquitto

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SIM_GOOD_RATE: ${SIM_GOOD_RATE:-0.95}
      VISION_MODE: ${VISION_MODE:-disabled}
      VISION_IMAGE_DIR: /app/inspection-images
      VISION_MIN_CONFIDENCE: ${VISION_MIN_CONFIDENCE:-0.7}
    volumes:
      - ${VISION_IMAGE_DIR:-./inspection-images}:/app/inspection-images:ro
    depends_on:
      - mosquitto

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATA_SOURCE: ${DATA_SOURCE:-mqtt}
      MODBUS_HOST: modbus-simulator
      MODBUS_PORT: 5020
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATABASE_PATH: /data/minifactory.db
    volumes:
      - production-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
      - modbus-simulator

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy


volumes:
  production-data:
